<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf360c"/>
    </marker>
  </defs>
  <!-- Fondo -->
  <rect width="1200" height="380" fill="#ffffff"/>

  <!-- Título superior -->
  <text x="600" y="32" fill="#bf360c" font-family="Inter, sans-serif" font-size="13"
        font-weight="700" text-anchor="middle" letter-spacing="0.12em">FLUJO DE TRABAJO · 6 FASES SECUENCIALES CON VALIDACIÓN CRUZADA</text>

  <!-- Phase boxes -->
  <g font-family="Inter, sans-serif" font-size="13" text-anchor="start">
    <!-- Fase 1 -->
    <g>
      <rect x="20" y="60" width="180" height="90" rx="10" fill="#f5f8fa" stroke="#0d47a1" stroke-width="2"/>
      <circle cx="42" cy="82" r="12" fill="#0d47a1"/>
      <text x="42" y="86" fill="#ffffff" font-weight="700" font-size="13" text-anchor="middle">1</text>
      <text x="62" y="86" fill="#0d47a1" font-weight="700" font-size="13.5">Datacube</text>
      <text x="32" y="108" fill="#1a1a1a" font-size="11.5">Sentinel-2 + Landsat</text>
      <text x="32" y="124" fill="#4a4a4a" font-size="11.5">geemap · xarray · CF-1.8</text>
      <text x="32" y="140" fill="#6a6a6a" font-size="10.5">Notebooks 01 · 09</text>
    </g>
    <!-- Fase 2 -->
    <g>
      <rect x="215" y="60" width="180" height="90" rx="10" fill="#f5f8fa" stroke="#4527a0" stroke-width="2"/>
      <circle cx="237" cy="82" r="12" fill="#4527a0"/>
      <text x="237" y="86" fill="#ffffff" font-weight="700" font-size="13" text-anchor="middle">2</text>
      <text x="257" y="86" fill="#4527a0" font-weight="700" font-size="13.5">Series + bfast</text>
      <text x="227" y="108" fill="#1a1a1a" font-size="11.5">NDVI mensual · z-score</text>
      <text x="227" y="124" fill="#4a4a4a" font-size="11.5">Python + R · bfast</text>
      <text x="227" y="140" fill="#6a6a6a" font-size="10.5">Notebooks 02 · 02b · 02c</text>
    </g>
    <!-- Fase 3 -->
    <g>
      <rect x="410" y="60" width="180" height="90" rx="10" fill="#f5f8fa" stroke="#ad1457" stroke-width="2"/>
      <circle cx="432" cy="82" r="12" fill="#ad1457"/>
      <text x="432" y="86" fill="#ffffff" font-weight="700" font-size="13" text-anchor="middle">3</text>
      <text x="452" y="86" fill="#ad1457" font-weight="700" font-size="13.5">Segmentación</text>
      <text x="422" y="108" fill="#1a1a1a" font-size="11.5">SamGeo · 3 RGB S2</text>
      <text x="422" y="124" fill="#4a4a4a" font-size="11.5">Topología DE-9IM</text>
      <text x="422" y="140" fill="#6a6a6a" font-size="10.5">Notebooks 03 · 04b · 04c</text>
    </g>
    <!-- Fase 4 -->
    <g>
      <rect x="605" y="60" width="180" height="90" rx="10" fill="#f5f8fa" stroke="#311b92" stroke-width="2"/>
      <circle cx="627" cy="82" r="12" fill="#311b92"/>
      <text x="627" y="86" fill="#ffffff" font-weight="700" font-size="13" text-anchor="middle">4</text>
      <text x="647" y="86" fill="#311b92" font-weight="700" font-size="13.5">Fragmentación</text>
      <text x="617" y="108" fill="#1a1a1a" font-size="11.5">Julia · LibGEOS</text>
      <text x="617" y="124" fill="#4a4a4a" font-size="11.5">NP · MSI · NND · área</text>
      <text x="617" y="140" fill="#6a6a6a" font-size="10.5">Notebook 04</text>
    </g>
    <!-- Fase 5 -->
    <g>
      <rect x="800" y="60" width="180" height="90" rx="10" fill="#f5f8fa" stroke="#1b5e20" stroke-width="2"/>
      <circle cx="822" cy="82" r="12" fill="#1b5e20"/>
      <text x="822" y="86" fill="#ffffff" font-weight="700" font-size="13" text-anchor="middle">5</text>
      <text x="842" y="86" fill="#1b5e20" font-weight="700" font-size="13.5">Clima · SAR</text>
      <text x="812" y="108" fill="#1a1a1a" font-size="11.5">ERA5 · ENSO · CHIRPS</text>
      <text x="812" y="124" fill="#4a4a4a" font-size="11.5">Caudal · S1 SAR-VH</text>
      <text x="812" y="140" fill="#6a6a6a" font-size="10.5">Notebooks 07 · 08 · 12</text>
    </g>
    <!-- Fase 6 -->
    <g>
      <rect x="995" y="60" width="180" height="90" rx="10" fill="#f5f8fa" stroke="#bf360c" stroke-width="2"/>
      <circle cx="1017" cy="82" r="12" fill="#bf360c"/>
      <text x="1017" y="86" fill="#ffffff" font-weight="700" font-size="13" text-anchor="middle">6</text>
      <text x="1037" y="86" fill="#bf360c" font-weight="700" font-size="13.5">Validación + RF</text>
      <text x="1007" y="108" fill="#1a1a1a" font-size="11.5">INVEMAR · WorldCover</text>
      <text x="1007" y="124" fill="#4a4a4a" font-size="11.5">Random Forest · alertas</text>
      <text x="1007" y="140" fill="#6a6a6a" font-size="10.5">Notebooks 05 · 10 · 11</text>
    </g>
  </g>

  <!-- Arrows entre fases -->
  <g fill="none" stroke="#bf360c" stroke-width="2" marker-end="url(#arr-flow)">
    <line x1="200" y1="105" x2="215" y2="105"/>
    <line x1="395" y1="105" x2="410" y2="105"/>
    <line x1="590" y1="105" x2="605" y2="105"/>
    <line x1="785" y1="105" x2="800" y2="105"/>
    <line x1="980" y1="105" x2="995" y2="105"/>
  </g>

  <!-- Salidas -->
  <g font-family="Inter, sans-serif" font-size="13" text-anchor="middle">
    <text x="600" y="200" fill="#6a6a6a" font-size="11.5" letter-spacing="0.1em">SALIDAS UNIFICADAS</text>
    <g>
      <rect x="55" y="220" width="200" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="155" y="244" fill="#1b5e20" font-weight="600">32 notebooks</text>
      <text x="155" y="262" fill="#4a4a4a" font-size="11.5">.ipynb numerados · reproducibles</text>
    </g>
    <g>
      <rect x="280" y="220" width="200" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="380" y="244" fill="#1b5e20" font-weight="600">54 tablas CSV</text>
      <text x="380" y="262" fill="#4a4a4a" font-size="11.5">Resultados numéricos</text>
    </g>
    <g>
      <rect x="505" y="220" width="200" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="605" y="244" fill="#1b5e20" font-weight="600">43 figuras PNG</text>
      <text x="605" y="262" fill="#4a4a4a" font-size="11.5">Mapas · series · correlaciones</text>
    </g>
    <g>
      <rect x="730" y="220" width="200" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="830" y="244" fill="#1b5e20" font-weight="600">Dashboard 17 capas</text>
      <text x="830" y="262" fill="#4a4a4a" font-size="11.5">HTML interactivo Leaflet</text>
    </g>
    <g>
      <rect x="955" y="220" width="200" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="1055" y="244" fill="#1b5e20" font-weight="600">Informe Quarto 50+ pp</text>
      <text x="1055" y="262" fill="#4a4a4a" font-size="11.5">PDF + HTML reproducible</text>
    </g>
  </g>

  <!-- Flechas verticales fases → salidas -->
  <g fill="none" stroke="#bf360c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr-flow)">
    <line x1="110" y1="150" x2="155" y2="220"/>
    <line x1="305" y1="150" x2="380" y2="220"/>
    <line x1="500" y1="150" x2="605" y2="220"/>
    <line x1="700" y1="150" x2="830" y2="220"/>
    <line x1="1080" y1="150" x2="1055" y2="220"/>
  </g>

  <!-- Docker base -->
  <g>
    <rect x="400" y="310" width="400" height="40" rx="8" fill="#f5f8fa" stroke="#006064" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="600" y="335" text-anchor="middle" fill="#006064" font-family="Inter, sans-serif" font-weight="700" font-size="12">Contenedor Docker sig_unal v1.11 · base reproducible</text>
  </g>
</svg>
