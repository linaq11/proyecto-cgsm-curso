<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf360c"/>
    </marker>
  </defs>
  <!-- Fondo oscuro para preservar la apariencia original -->
  <rect width="1100" height="380" fill="#ffffff"/>
  <!-- Título superior -->
  <text x="550" y="30" fill="#bf360c" font-family="Inter, sans-serif" font-size="13"
        font-weight="700" text-anchor="middle" letter-spacing="0.12em">FLUJO DE TRABAJO · 6 FASES SECUENCIALES CON VALIDACIÓN CRUZADA</text>
  <!-- Phase boxes -->
  <g font-family="Inter, sans-serif" font-size="14" text-anchor="middle">
    <!-- Fase 1 -->
    <g>
      <rect x="40" y="60" width="160" height="80" rx="10" fill="#f5f8fa" stroke="#0d47a1" stroke-width="2"/>
      <circle cx="60" cy="80" r="11" fill="#0d47a1"/><text x="60" y="84" fill="#ffffff" font-weight="700" font-size="13">1</text>
      <text x="120" y="86" fill="#0d47a1" font-weight="700">Datacube</text>
      <text x="120" y="102" fill="#1a1a1a" font-size="11.5">Sentinel-2 + Landsat</text>
      <text x="120" y="118" fill="#4a4a4a" font-size="11.5">geemap · xarray · CF-1.8</text>
      <text x="120" y="132" fill="#6a6a6a" font-size="10.5">Notebooks 01 · 09</text>
    </g>
    <!-- Fase 2 -->
    <g>
      <rect x="220" y="60" width="160" height="80" rx="10" fill="#f5f8fa" stroke="#4527a0" stroke-width="2"/>
      <circle cx="240" cy="80" r="11" fill="#4527a0"/><text x="240" y="84" fill="#ffffff" font-weight="700" font-size="13">2</text>
      <text x="300" y="86" fill="#4527a0" font-weight="700">Series + BFAST</text>
      <text x="300" y="102" fill="#1a1a1a" font-size="11.5">NDVI mensual · z-score</text>
      <text x="300" y="118" fill="#4a4a4a" font-size="11.5">Python + R · bfast</text>
      <text x="300" y="132" fill="#6a6a6a" font-size="10.5">Notebooks 02 · 02b · 02c</text>
    </g>
    <!-- Fase 3 -->
    <g>
      <rect x="400" y="60" width="160" height="80" rx="10" fill="#f5f8fa" stroke="#ad1457" stroke-width="2"/>
      <circle cx="420" cy="80" r="11" fill="#ad1457"/><text x="420" y="84" fill="#ffffff" font-weight="700" font-size="13">3</text>
      <text x="480" y="86" fill="#ad1457" font-weight="700">Segmentación</text>
      <text x="480" y="102" fill="#1a1a1a" font-size="11.5">SamGeo · 3 RGB S2</text>
      <text x="480" y="118" fill="#4a4a4a" font-size="11.5">Topología DE-9IM</text>
      <text x="480" y="132" fill="#6a6a6a" font-size="10.5">Notebooks 03 · 04b · 04c</text>
    </g>
    <!-- Fase 4 -->
    <g>
      <rect x="580" y="60" width="160" height="80" rx="10" fill="#f5f8fa" stroke="#311b92" stroke-width="2"/>
      <circle cx="600" cy="80" r="11" fill="#311b92"/><text x="600" y="84" fill="#ffffff" font-weight="700" font-size="13">4</text>
      <text x="660" y="86" fill="#311b92" font-weight="700">Fragmentación</text>
      <text x="660" y="102" fill="#1a1a1a" font-size="11.5">Julia · shoelace</text>
      <text x="660" y="118" fill="#4a4a4a" font-size="11.5">NND · MSI · área</text>
      <text x="660" y="132" fill="#6a6a6a" font-size="10.5">Notebook 04</text>
    </g>
    <!-- Fase 5 -->
    <g>
      <rect x="760" y="60" width="160" height="80" rx="10" fill="#f5f8fa" stroke="#1b5e20" stroke-width="2"/>
      <circle cx="780" cy="80" r="11" fill="#1b5e20"/><text x="780" y="84" fill="#ffffff" font-weight="700" font-size="13">5</text>
      <text x="840" y="86" fill="#1b5e20" font-weight="700">Clima · ENSO · SAR</text>
      <text x="840" y="102" fill="#1a1a1a" font-size="11.5">ERA5 · ONI · CHIRPS</text>
      <text x="840" y="118" fill="#4a4a4a" font-size="11.5">Caudal · S1 SAR serie</text>
      <text x="840" y="132" fill="#6a6a6a" font-size="10.5">07 · 08 · 12</text>
    </g>
    <!-- Fase 6 -->
    <g>
      <rect x="940" y="60" width="120" height="80" rx="10" fill="#f5f8fa" stroke="#bf360c" stroke-width="2"/>
      <circle cx="960" cy="80" r="11" fill="#bf360c"/><text x="960" y="84" fill="#ffffff" font-weight="700" font-size="13">6</text>
      <text x="1000" y="86" fill="#bf360c" font-weight="700">Validación + RF + DT</text>
      <text x="1000" y="102" fill="#1a1a1a" font-size="11.5">WorldCover · INVEMAR</text>
      <text x="1000" y="118" fill="#4a4a4a" font-size="11.5">RF · alertas semáforo</text>
      <text x="1000" y="132" fill="#6a6a6a" font-size="10.5">05 · 10 · 11 · alertas</text>
    </g>
  </g>
  <!-- Arrows between phases -->
  <g fill="none" stroke="#bf360c" stroke-width="2" marker-end="url(#arr-flow)">
    <line x1="200" y1="100" x2="220" y2="100"/>
    <line x1="380" y1="100" x2="400" y2="100"/>
    <line x1="560" y1="100" x2="580" y2="100"/>
    <line x1="740" y1="100" x2="760" y2="100"/>
    <line x1="920" y1="100" x2="940" y2="100"/>
  </g>
  <!-- Outputs bottom row -->
  <g font-family="Inter, sans-serif" font-size="13" text-anchor="middle">
    <text x="550" y="195" fill="#6a6a6a" font-size="11.5" letter-spacing="0.1em">SALIDAS UNIFICADAS</text>
    <g>
      <rect x="60" y="220" width="180" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="150" y="244" fill="#1b5e20" font-weight="600">31 notebooks</text>
      <text x="150" y="262" fill="#4a4a4a" font-size="11.5">.ipynb numerados · reproducibles</text>
    </g>
    <g>
      <rect x="260" y="220" width="180" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="350" y="244" fill="#1b5e20" font-weight="600">47 tablas CSV</text>
      <text x="350" y="262" fill="#4a4a4a" font-size="11.5">Resultados numéricos</text>
    </g>
    <g>
      <rect x="460" y="220" width="180" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="550" y="244" fill="#1b5e20" font-weight="600">38 figuras PNG</text>
      <text x="550" y="262" fill="#4a4a4a" font-size="11.5">Mapas · series · correlaciones</text>
    </g>
    <g>
      <rect x="660" y="220" width="180" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="750" y="244" fill="#1b5e20" font-weight="600">Dashboard 15 capas</text>
      <text x="750" y="262" fill="#4a4a4a" font-size="11.5">HTML interactivo Leaflet</text>
    </g>
    <g>
      <rect x="860" y="220" width="180" height="60" rx="8" fill="#f5f8fa" stroke="#1b5e20" stroke-width="1.5"/>
      <text x="950" y="244" fill="#1b5e20" font-weight="600">Informe Quarto 50+ pp</text>
      <text x="950" y="262" fill="#4a4a4a" font-size="11.5">PDF reproducible</text>
    </g>
  </g>
  <!-- Vertical arrows from phases to outputs -->
  <g fill="none" stroke="#bf360c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr-flow)">
    <line x1="120" y1="140" x2="150" y2="220"/>
    <line x1="300" y1="140" x2="350" y2="220"/>
    <line x1="480" y1="140" x2="550" y2="220"/>
    <line x1="660" y1="140" x2="750" y2="220"/>
    <line x1="840" y1="140" x2="950" y2="220"/>
  </g>
  <!-- Docker base -->
  <g>
    <rect x="350" y="310" width="400" height="40" rx="8" fill="#f5f8fa" stroke="#006064" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="550" y="335" text-anchor="middle" fill="#006064" font-family="Inter, sans-serif" font-weight="700" font-size="12">Contenedor Docker sig_unal v1.11 · base reproducible</text>
  </g>
</svg>
